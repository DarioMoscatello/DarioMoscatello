<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img" aria-label="English language fluent card">
  <defs>
    <clipPath id="flagClip">
      <rect x="130" y="260" width="440" height="220" rx="0"/>
    </clipPath>
  </defs>

  <rect width="700" height="1000" rx="46" fill="#000000"/>

  <!-- United Kingdom flag, proportion-preserving and fully vector -->
