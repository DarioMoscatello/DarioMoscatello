<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dario Moscatello</title>
    <meta name="description" content="Dario Moscatello. Real Estate Analyst at Copernicus, studying Economics and Management at Bocconi University in Milan." />
    <meta name="theme-color" content="#F2F2F0" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dario Moscatello" />
    <meta property="og:description" content="Dreamer. Thinker. Builder." />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/unbounded-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/geist-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script type="module" src="assets/js/main.js"></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero__frame">
        <span class="hero__mark" style="--mx: 0" aria-hidden="true"></span>
        <span class="hero__mark" style="--mx: var(--line-1)" aria-hidden="true"></span>
        <span class="hero__mark" style="--mx: var(--line-2)" aria-hidden="true"></span>
        <span class="hero__mark" style="--mx: 1" aria-hidden="true"></span>
        <span class="hero__mark hero__mark--bottom" style="--mx: 0" aria-hidden="true"></span>
        <span class="hero__mark hero__mark--bottom" style="--mx: var(--line-1)" aria-hidden="true"></span>
        <span class="hero__mark hero__mark--bottom" style="--mx: var(--line-2)" aria-hidden="true"></span>
        <span class="hero__mark hero__mark--bottom" style="--mx: 1" aria-hidden="true"></span>

        <div class="hero__band" aria-hidden="true"></div>

        <p class="hero__lede">I<br />Am</p>

        <div class="hero__title-row">
          <svg class="hero__arrow hero__arrow--left" viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0 10 6 0 12z" /></svg>
          <h1 class="hero__title">
            <span class="visually-hidden">Dario Moscatello</span>
            <canvas data-title aria-hidden="true"></canvas>
          </h1>
          <svg class="hero__arrow hero__arrow--right" viewBox="0 0 10 12" aria-hidden="true"><path d="M10 0 0 6 10 12z" /></svg>
        </div>

        <p class="hero__name">Dario Moscatello</p>
        <p class="hero__tag">Dreamer. Thinker. Builder.</p>
      </div>
    </header>

    <main class="stage" id="portfolio" data-stage>
      <nav class="sections" aria-label="Sections">
        <ul data-nav></ul>
      </nav>

      <section class="panel" aria-live="polite" data-panel>
        <div class="panel__inner" data-panel-inner></div>
      </section>

      <div
        class="wheel"
        data-wheel
        tabindex="0"
        role="region"
        aria-roledescription="card wheel"
        aria-label="Cards. Use the left and right arrow keys to turn the wheel."
      >
        <div class="wheel__cards" data-wheel-cards></div>
        <span class="wheel__line" aria-hidden="true"></span>

        <div class="wheel__disc">
          <svg class="wheel__ring" viewBox="-120 -120 240 240" aria-hidden="true">
            <defs>
              <path id="ring-path" d="M 0,-62 a 62,62 0 1,1 0,124 a 62,62 0 1,1 0,-124" />
            </defs>
            <g class="wheel__ticks" data-wheel-ticks></g>
            <circle class="wheel__rim" r="118.6" />
            <circle class="wheel__dash" r="103" />
            <g data-wheel-ring>
              <text class="wheel__ring-text">
                <textPath href="#ring-path" textLength="389" lengthAdjust="spacing">PORTFOLIO · PORTFOLIO · PORTFOLIO · PORTFOLIO · PORTFOLIO · </textPath>
              </text>
            </g>
            <path class="wheel__tri" d="M0 -98 4.4 -90.6 -4.4 -90.6z" />
            <text class="wheel__me" x="0" y="-78.5" text-anchor="middle">ME</text>
          </svg>
          <button class="wheel__draw" type="button" data-wheel-draw>Draw a card</button>
        </div>
      </div>
    </main>

    <noscript>
      <p class="noscript">This portfolio needs JavaScript to deal its cards.</p>
    </noscript>
  </body>
</html>
