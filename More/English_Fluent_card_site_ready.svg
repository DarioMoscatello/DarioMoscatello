    <rect x="130" y="260" width="440" height="220" fill="#012169"/>

    <!-- broad white diagonals -->
    <path d="M130 260 L179 260 L570 455 L570 480 L521 480 L130 285 Z" fill="#FFFFFF"/>
    <path d="M570 260 L521 260 L130 455 L130 480 L179 480 L570 285 Z" fill="#FFFFFF"/>

    <!-- red diagonals -->
    <path d="M130 260 L154 260 L570 468 L570 480 L546 480 L130 272 Z" fill="#C8102E"/>
    <path d="M570 260 L546 260 L130 468 L130 480 L154 480 L570 272 Z" fill="#C8102E"/>

    <!-- central white cross -->
    <rect x="130" y="342.5" width="440" height="55" fill="#FFFFFF"/>
    <rect x="322.5" y="260" width="55" height="220" fill="#FFFFFF"/>

    <!-- central red cross -->
    <rect x="130" y="354.5" width="440" height="31" fill="#C8102E"/>
    <rect x="334.5" y="260" width="31" height="220" fill="#C8102E"/>
  </g>

