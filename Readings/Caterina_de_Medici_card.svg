<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" width="700" height="1000"
     role="img" aria-label="Caterina de’ Medici, Alessandra Necci">
  <style>@font-face{font-family:'Geist Card';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Card';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
    text { font-family: 'Geist Card', 'Geist', system-ui, sans-serif; fill: #FFFFFF; }
    .title { font-weight: 500; font-size: 58px; letter-spacing: -0.01em; }
    .small { font-weight: 400; font-size: 27px; letter-spacing: 0.02em; }
  </style>
  <defs>
    <clipPath id="cardClip"><rect width="700" height="1000" rx="42" ry="42"/></clipPath>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="700" height="1000" fill="#8B8881"/>
    <rect width="30" height="1000" fill="#7B7871"/>
    <rect x="30" width="1.5" height="1000" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>
  <text class="title">
    <tspan x="80" y="153.2">CATERINA DE’</tspan>
    <tspan x="80" y="213.5">MEDICI</tspan>
  </text>
  <rect x="80" y="250.5" width="564" height="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <g transform="translate(618 40)">
    <clipPath id="flagClip"><rect width="42" height="27" rx="2.5" ry="2.5"/></clipPath>
    <g clip-path="url(#flagClip)">
      <rect width="42" height="27" fill="#008C45"/>
      <rect x="14.0" width="14.0" height="27" fill="#F4F5F0"/>
      <rect x="28.0" width="14.0" height="27" fill="#CD212A"/>
    </g>
    <rect width="42" height="27" rx="2.5" ry="2.5" fill="none" stroke="#00000022" stroke-width="0.9"/>
  </g>
  <text class="small" fill-opacity="0.78">
    <tspan x="80" y="305.7">UN’ITALIANA ALLA CONQUISTA DELLA</tspan>
    <tspan x="80" y="344.0">FRANCIA</tspan>
  </text>
  <text class="small" fill-opacity="0.9">
    <tspan x="80" y="922.0">ALESSANDRA NECCI</tspan>
  </text>
</svg>
